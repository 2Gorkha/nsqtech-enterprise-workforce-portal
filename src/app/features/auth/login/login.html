<div class="min-h-screen bg-[#0B1120] flex items-center justify-center px-6">

  <div class="w-full max-w-7xl flex items-center justify-between">

    <!-- USER SECTION -->

    <div
      class="flex flex-col items-center transition-all duration-500"
    >

      <div
        (click)="selectRole('User')"
        class="w-40 h-40 rounded-full cursor-pointer flex items-center justify-center text-2xl font-bold text-white transition-all duration-500"
        [ngClass]="{
          'bg-orange-500 shadow-[0_0_80px_20px_rgba(249,115,22,0.8)] scale-110': selectedRole === 'User',
          'bg-gray-700': selectedRole !== 'User'
        }"
      >
        User
      </div>

      <p class="text-orange-300 mt-6 text-lg">
        General User Access
      </p>

    </div>

    <!-- CENTER PANEL -->

    <div
      class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-10 shadow-2xl transition-all duration-500"
    >

      @if(selectedRole === '') {

        <div class="text-center text-white">

          <h1 class="text-4xl font-bold mb-4">
            NSQTech Portal
          </h1>

          <p class="text-gray-300">
            Select a role to continue
          </p>

        </div>

      }

      @if(selectedRole !== '') {

        <div>

          <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-white">
              {{ selectedRole }} Login
            </h1>

            <p class="text-gray-300 mt-2">
              Secure Access Portal
            </p>

          </div>

          <form class="space-y-5">

            <input
              type="text"
              [(ngModel)]="userId"
              name="userId"
              placeholder="Enter User ID"
              class="w-full px-5 py-4 rounded-xl bg-white/10 border border-gray-500 text-white placeholder-gray-300 focus:outline-none"
            >

            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Enter Password"
              class="w-full px-5 py-4 rounded-xl bg-white/10 border border-gray-500 text-white placeholder-gray-300 focus:outline-none"
            >

            <button
              type="button"
              (click)="handleLogin()"
              class="w-full py-4 rounded-xl text-white font-semibold transition-all duration-300"
              [ngClass]="{
                'bg-orange-500 hover:bg-orange-600': selectedRole === 'User',
                'bg-blue-500 hover:bg-blue-600': selectedRole === 'Admin'
              }"
            >
              Login as {{ selectedRole }}
            </button>

          </form>

        </div>

      }

    </div>

    <!-- ADMIN SECTION -->

    <div
      class="flex flex-col items-center transition-all duration-500"
    >

      <div
        (click)="selectRole('Admin')"
        class="w-40 h-40 rounded-full cursor-pointer flex items-center justify-center text-2xl font-bold text-white transition-all duration-500"
        [ngClass]="{
          'bg-blue-500 shadow-[0_0_80px_20px_rgba(59,130,246,0.8)] scale-110': selectedRole === 'Admin',
          'bg-gray-700': selectedRole !== 'Admin'
        }"
      >
        Admin
      </div>

      <p class="text-blue-300 mt-6 text-lg">
        Administrative Access
      </p>

    </div>

  </div>

</div>
